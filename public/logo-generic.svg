<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&amp;family=Jost:wght@200;300&amp;display=swap');
    </style>
  </defs>

  <!-- Decorative left line -->
  <line x1="0" y1="40" x2="18" y2="40" stroke="#c8a96e" stroke-width="0.8"/>

  <!-- Scissors icon -->
  <g transform="translate(22, 28)" stroke="#c8a96e" stroke-width="1" fill="none">
    <line x1="0" y1="0" x2="14" y2="24"/>
    <line x1="14" y1="0" x2="0" y2="24"/>
    <circle cx="3" cy="3" r="3"/>
    <circle cx="11" cy="3" r="3"/>
  </g>

  <!-- Decorative right line of icon -->
  <line x1="42" y1="40" x2="52" y2="40" stroke="#c8a96e" stroke-width="0.8"/>

  <!-- Main name -->
  <text x="58" y="34"
    font-family="Cormorant Garamond, Georgia, serif"
    font-size="28"
    font-weight="300"
    letter-spacing="4"
    fill="#f5f0e8">TU LOGO</text>

  <!-- Sub name -->
  <text x="59" y="56"
    font-family="Jost, sans-serif"
    font-size="10"
    font-weight="200"
    letter-spacing="8"
    fill="#c8a96e">ESTILISTAS</text>

  <!-- Decorative right line -->
  <line x1="390" y1="40" x2="420" y2="40" stroke="#c8a96e" stroke-width="0.8"/>
</svg>
