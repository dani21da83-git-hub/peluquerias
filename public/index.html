<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ejercicios</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#2c2c2c;--muted:#474747cc;--border:#c8d9d0;--accent:#2f6852;--bg:#ffffff;--soft:#dcebe1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/22px Inter,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:64px 16px}
h1{margin:0 0 8px;font:600 32px/40px Inter,Arial,sans-serif}
p{margin:0 0 32px;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
a{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border:2px solid var(--border);border-radius:16px;color:inherit;text-decoration:none;font-weight:600}
a:hover{background:var(--soft);border-color:var(--accent)}
a span{color:var(--accent)}
</style>
</head>
<body>
<main>
<h1>Ejercicios</h1>
<p>Selecciona una página.</p>
<ul>
<li><a href="/modulo">Card Secondary Module <span>→</span></a></li>
<li><a href="/carrusel">Carrusel (4 cards) <span>→</span></a></li>
<li><a href="/pagina-completa">Página completa <span>→</span></a></li>
</ul>
</main>
</body>
</html>
